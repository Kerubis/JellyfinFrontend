server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Hashed build output: never changes under the same name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Entry points: always revalidate, so an update shows up on the next load.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /config.js {
        add_header Cache-Control "no-cache";
    }

    # Client-side routes (/series/…, /library/…) all load the app.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
