# Seerr target from the browser's X-Seerr-Url header (the profile's Seerr server, set by an admin in the app);
# only http(s)://host[:port], anything else maps to "" and is refused.
map $http_x_seerr_url $seerr_target {
    "~^(?<target>https?://[A-Za-z0-9.:\[\]-]+)$" $target;
    default "";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Hashed build output: never changes under the same name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Entry points: always revalidate, so an update shows up on the next load.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /config.js {
        add_header Cache-Control "no-cache";
    }

    # AnimeSchedule.net API (sends no CORS headers): passed through as-is, with the browser's Authorization
    # header (each profile's own app token, nothing stored here). Resolved per request, so the container also
    # starts without internet; the resolver comes from /etc/resolv.conf (docker/40-jff-config.sh).
    include /etc/nginx/jff-resolver.conf;
    location /animeschedule/ {
        limit_except GET { deny all; }
        set $animeschedule https://animeschedule.net;
        rewrite ^/animeschedule/(.*)$ /api/v3/$1 break;
        proxy_pass $animeschedule;
        proxy_ssl_server_name on;
        proxy_set_header Host animeschedule.net;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
    }

    # Seerr API (sends no CORS headers): passed through to the server in X-Seerr-Url with the browser's X-Api-Key,
    # nothing stored here. Only the endpoints the app uses (same list as the dev proxy in vite.config.ts).
    location ~ ^/seerr/(auth/me|search|request|movie/[0-9]+|tv/[0-9]+|user/jellyfin/[0-9a-fA-F-]+|service/(sonarr|radarr)(/[0-9]+)?)$ {
        limit_except GET POST { deny all; }
        if ($seerr_target = "") { return 400; }
        rewrite ^/seerr/(.*)$ /api/v1/$1 break;
        proxy_pass $seerr_target;
        proxy_set_header X-Seerr-Url "";
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
    }
    location /seerr/ {
        return 404;
    }

    # Client-side routes (/series/…, /library/…) all load the app.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
